robust-autonomy:
  - title: End-to-End Goal-Initialized Navigation
    summary: GUIDE learns directional awareness from depth and proprioceptive history, enabling a legged robot to navigate cluttered environments without continuous goal updates or prior maps.
    media_label: Real-world demo
    poster: images/publications/guide.jpg
    fit: contain
    demo: media/research/demos/guide-navigation.mp4
    preview: media/research/previews/guide-navigation-v1.mp4
    source_asset: https://guide-navigation.github.io/public/assets/videos/web/wild_02_outdoor.mp4
    project_url: https://guide-navigation.github.io/
    link_label: Explore GUIDE
    attribution: 2026

  - title: All-Weather 3D Occupancy with 4D Radar
    summary: RadarOcc uses 4D imaging radar to estimate dense 3D occupancy in adverse weather and lighting conditions where camera- and LiDAR-based perception can degrade.
    media_label: Adverse-weather demo
    poster: images/featured-radarocc.jpg
    fit: contain
    demo: media/research/demos/radarocc-snow.mp4
    source_asset: https://fangqiangding.com/publication/24-radarocc-neurips/resources/radarocc_gif_demo_snow.gif
    project_url: https://fangqiangding.com/publication/24-radarocc-neurips/
    link_label: Explore RadarOcc
    attribution: NeurIPS 2024

  - title: 4D Radar Scene Flow Estimation
    summary: Hidden Gems learns scene flow from sparse 4D radar through cross-modal supervision, supporting motion segmentation and ego-motion estimation in dynamic driving scenes.
    poster: images/publications/hidden-gems.jpg
    fit: contain
    demos:
      - src: media/research/demos/hidden-gems-scene-flow.mp4
        poster: images/research/topics/hidden-gems-scene-flow.jpg
        label: Scene Flow
      - src: media/research/demos/hidden-gems-motion-seg.mp4
        poster: images/research/topics/hidden-gems-motion-seg.jpg
        label: Segmentation
      - src: media/research/demos/hidden-gems-ego-motion.mp4
        poster: images/research/topics/hidden-gems-ego-motion.jpg
        label: Ego-Motion
    source_asset:
      - https://fangqiangding.com/publication/23-cmflow-cvpr/gifs/scene-flow/gif-1.gif
      - https://fangqiangding.com/publication/23-cmflow-cvpr/gifs/motion-seg/gif-1.gif
      - https://fangqiangding.com/publication/23-cmflow-cvpr/gifs/ego-motion/gif-1.gif
    project_url: https://fangqiangding.com/publication/23-cmflow-cvpr/
    link_label: Explore Hidden Gems
    attribution: CVPR 2023 Highlight

  - title: "FireNav: Hazard-Aware Navigation in Fire-ground Environment"
    summary: FireNav combines controllable fire simulation with synchronized thermal and 4D radar observations to benchmark PointGoal Navigation, evaluating goal completion and collision avoidance alongside peak temperature and cumulative heat exposure.
    media_label: Fire rescue
    poster: images/research/topics/firenav.jpg
    fit: contain
    demo: media/research/demos/firenav.mp4
    attribution: Ongoing lab prototype · Not linked to a publication

human-sensing:
  - title: Wrist-Worn Muscle-Activity Sensing
    summary: This lab demonstration shows a wrist-worn sensing setup collecting multichannel surface electromyography and inertial signals during hand gestures. The prototype supports our exploration of compact wearable measurements that connect muscle activation with motion and physical interaction.
    media_label: Lab demonstration
    poster: images/research/topics/wrist-semg-collection.png
    demo: media/research/demos/wrist-semg-collection.mp4
    preview: media/research/previews/wrist-semg-v1.mp4
    fit: contain
    attribution: Ongoing lab prototype · Not linked to a publication

  - title: Multimodal Human Motion Capture and Mesh Reconstruction
    summary: M4Human synchronizes mmWave radar, RGB-D, and marker-based motion capture at scale, supporting radar-based reconstruction of articulated 3D human meshes.
    media_label: Dataset demo
    poster: images/featured-m4human.jpg
    fit: contain
    demo: media/research/demos/m4human-capture.mp4
    source_asset: https://fanjunqiao.github.io/M4Human-site/static/dataset_videos/combined_output_depth_50.mp4
    project_url: https://fanjunqiao.github.io/M4Human-site/
    link_label: Explore M4Human
    attribution: CVPR 2026

  - title: Thermal Egocentric Hand Pose
    summary: ThermoHands captures articulated 3D hand motion from egocentric thermal images during object interactions, including conditions affected by darkness, glare, and handwear.
    media_label: Adverse-condition demo
    poster: images/research/topics/thermohands-conditions.jpg
    fit: contain
    demo: media/research/demos/thermohands-conditions.mp4
    source_asset:
      - https://thermohands.github.io/resources/sun_glare_2_clip.mp4
      - https://thermohands.github.io/resources/kitchen_2_clip.mp4
      - https://thermohands.github.io/resources/darkness_object_2_clip.mp4
      - https://thermohands.github.io/resources/darkness_virtual_2.mp4
    project_url: https://thermohands.github.io/
    link_label: Explore ThermoHands
    attribution: SenSys 2025

  - title: mmWave Radar Human Motion Sensing
    summary: milliFlow estimates human scene flow from sparse mmWave radar point clouds, providing motion representations without relying on conventional visible-light imagery.
    media_label: Research preview
    image: images/featured-milliflow.jpg
    alt: milliFlow human motion sensing research preview
    fit: contain
    project_url: https://arxiv.org/abs/2306.17010
    link_label: View milliFlow
    attribution: ECCV 2024

embodied-autonomy:
  - title: Progress-Aware Long-Horizon Manipulation
    summary: PALM combines structured affordance reasoning with continuous subtask progress estimation to maintain coherent behavior across multi-step manipulation tasks.
    media_label: Real-robot demo
    poster: images/research/topics/palm-real-world-setup.jpg
    fit: contain
    demo: media/research/demos/palm-progress.mp4
    preview: media/research/previews/palm-progress-v1.mp4
    source_asset: https://plan-lab.github.io/projects/palm/static/videos/original.mp4
    project_url: https://plan-lab.github.io/projects/palm/
    link_label: Explore PALM
    attribution: CVPR 2026

  - title: Sequential Block Stacking with a Single Arm
    summary: This lab demonstration follows a single robotic arm as it places blocks in sequence. The setup provides a focused testbed for perception, action sequencing, task-state tracking, and reliable execution as we develop longer and more adaptive manipulation behaviors.
    media_label: Lab demonstration
    poster: images/research/topics/single-arm-block-stacking.png
    demo: media/research/demos/single-arm-block-stacking.mp4
    fit: contain
    attribution: Ongoing lab prototype · Not linked to a publication

scalable-physical-ai:
  - title: Seeking Physics in Diffusion Noise
    summary: Seeking Physics uncovers physical-plausibility signals in intermediate diffusion features, then uses a lightweight verifier to select and guide denoising trajectories toward more physically consistent generated videos.
    media_label: Physics-aware generation
    poster: images/publications/seeking-physics.jpg
    fit: contain
    demo: media/research/demos/seeking-physics.m4v
    preview: media/research/previews/seeking-physics-v1.mp4
    project_url: https://thegreatestcj.github.io/Physics-in-Noise/
    link_label: Explore Seeking Physics
    attribution: 2026

  - title: Camera-Conditioned Radar Data Generation
    summary: RadarGen synthesizes automotive radar point clouds from multi-view cameras while preserving geometry, motion, and occlusion structure, illustrating a data-generation pipeline grounded in real scenes.
    media_label: Generation demo
    fit: contain
    demo: media/research/demos/radargen.mp4
    source_asset: https://radargen.github.io/static/videos/scene_2.mp4
    project_url: https://radargen.github.io/
    link_label: Explore RadarGen
    attribution: ECCV 2026

  - title: "TacFoundry: Touch-Aware Real-to-Sim Asset Generation from Video"
    summary: TacFoundry turns ordinary videos into touchable, simulation-ready objects. It reconstructs 3D geometry, replays real gripper motions in a physics simulator, and generates simulated tactile observations using a learned sensor model.
    media_label: Lab demonstration
    fit: contain
    demo: media/research/demos/tactile-real-to-sim.mp4
    attribution: Ongoing lab prototype · Not linked to a publication

  - title: "WorldForge: Learning Physics from Real-World Feedback"
    summary: WorldForge is an agentic Real2Sim2Real framework that learns physical properties from real-world robot interactions and failures to continuously refine simulation. It enables the simulator and robot policy to co-evolve, with the aim of improving sim-to-real transfer.
    media_label: Lab demonstration
    fit: contain
    demo: media/research/demos/scene-real-to-sim.mp4
    attribution: Ongoing lab prototype · Not linked to a publication
