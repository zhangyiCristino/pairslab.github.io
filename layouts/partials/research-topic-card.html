<article class="research-topic-card{{ if .external_reference }} is-external{{ end }}">
  <div class="research-topic-media is-{{ .fit | default "contain" }}{{ if .demos }} is-stacked{{ end }}">
    {{ with .demos }}
      <div class="research-topic-media-stack">
        {{ range . }}
          <div class="research-topic-media-slot">
            {{ with .label }}<span class="research-topic-media-slot-label">{{ . }}</span>{{ end }}
            <div class="research-topic-media-frame">
              <video data-research-loop muted loop playsinline preload="none"{{ with .poster }} poster="{{ partial "image-url.html" (dict "src" . "width" 960) }}"{{ end }} aria-hidden="true">
                <source data-src="{{ .src | relURL }}" type="video/mp4">
              </video>
            </div>
          </div>
        {{ end }}
      </div>
    {{ else }}
      {{ with .demo }}
        <video data-research-loop muted loop playsinline preload="none"{{ with $.poster }} poster="{{ partial "image-url.html" (dict "src" . "width" 960) }}"{{ end }} aria-hidden="true">
          <source data-src="{{ . | relURL }}" type="video/mp4">
        </video>
      {{ else }}
        <img src="{{ partial "image-url.html" (dict "src" (.image | default .poster) "width" 960 "quality" 85) }}" alt="{{ .alt | default .title }}" loading="lazy" decoding="async">
      {{ end }}
    {{ end }}
    {{ with .media_label }}<span class="research-topic-media-label">{{ . }}</span>{{ end }}
  </div>

  <div class="research-topic-copy">
    <p class="research-topic-attribution">{{ .attribution }}</p>
    <h3>{{ .title }}</h3>
    <p>{{ .summary | markdownify }}</p>
    {{ with .project_url }}
      <a href="{{ . }}" target="_blank" rel="noreferrer">{{ $.link_label }} <span aria-hidden="true">↗</span></a>
    {{ end }}
  </div>
</article>
