<footer class="site-footer">
  <div class="footer-shell">
    <div class="footer-identity">
      <a class="brand brand-footer" href="{{ site.Home.RelPermalink }}">
        <img class="footer-pairs-logo" src="{{ partial "image-url.html" (dict "src" "brand/logo/pairs-lab-primary-horizontal-reverse.svg") }}" alt="PAIRS Lab — Physical AI and Robotic Systems Lab">
      </a>
    </div>

    <div class="footer-contact">
      <span class="footer-label">Find us</span>
      <p>E3(C9) 508 · HKUST(GZ)<br>Nansha, Guangzhou, China</p>
    </div>

    <div class="footer-links">
      <span class="footer-label">Affiliation &amp; links</span>
      <a class="footer-university" href="https://www.hkust-gz.edu.cn/" target="_blank" rel="noreferrer">
        <img src="{{ partial "image-url.html" (dict "src" "images/hkustgz-logo-white.png" "width" 480) }}" alt="HKUST(GZ)">
      </a>
      <a href="https://github.com/pairslab" target="_blank" rel="noreferrer">GitHub ↗</a>
      <a href="https://www.xiaohongshu.com/user/profile/6a866e5a000000000301cb81" target="_blank" rel="noreferrer">Xiaohongshu ↗</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© {{ now.Year }} PAIRS Lab · HKUST(GZ)</span>
    {{ if hugo.IsProduction }}
      <span class="site-cache-control" data-site-cache hidden>
        <button type="button" data-cache-refresh>Refresh site cache</button>
        <span role="status" data-cache-status></span>
      </span>
    {{ end }}
  </div>
</footer>
