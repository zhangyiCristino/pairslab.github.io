<header class="site-header" data-header>
  <div class="header-shell">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="PAIRS Lab home">
      <picture class="brand-logo">
        <source media="(max-width: 680px)" srcset="{{ partial "image-url.html" (dict "src" "brand/logo/pairs-lab-compact-horizontal-color.svg") }}">
        <img src="{{ partial "image-url.html" (dict "src" "brand/logo/pairs-lab-primary-horizontal-color.svg") }}" alt="PAIRS Lab — Physical AI and Robotic Systems Lab">
      </picture>
    </a>

    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
      <span></span><span></span>
      <span class="sr-only" aria-hidden="true">Open navigation</span>
    </button>

    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-nav>
      {{ $current := .RelPermalink }}
      {{ range site.Menus.main }}
        {{ $target := .URL | relURL }}
        <a href="{{ $target }}" class="{{ if or (and $.IsHome (eq .URL "/")) (and (ne .URL "/") (hasPrefix $current $target)) }}is-active{{ end }}">
          {{ .Name }}
        </a>
      {{ end }}
      <a class="institution-logo" href="https://www.hkust-gz.edu.cn/" target="_blank" rel="noreferrer" aria-label="The Hong Kong University of Science and Technology (Guangzhou)">
        <img src="{{ partial "image-url.html" (dict "src" "images/hkustgz-logo-color.png" "width" 480) }}" alt="The Hong Kong University of Science and Technology (Guangzhou)">
      </a>
    </nav>
  </div>
</header>
